<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Responsive Layout Mockup (Desktop + Mobile) -->
  <g transform="translate(60, 60)">
    <!-- Desktop Screen -->
    <rect width="480" height="380" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 8 Q 0 0 8 0 L 472 0 Q 480 0 480 8 L 480 32 L 0 32 Z" fill="#0f172a"/>
    <circle cx="18" cy="16" r="4" fill="#64748b"/>
    <circle cx="32" cy="16" r="4" fill="#64748b"/>
    <circle cx="46" cy="16" r="4" fill="#64748b"/>
    
    <!-- Desktop content elements -->
    <rect x="30" y="55" width="200" height="18" rx="3" fill="#38bdf8"/>
    <rect x="30" y="85" width="420" height="10" rx="2" fill="#475569"/>
    <rect x="30" y="103" width="360" height="10" rx="2" fill="#334155"/>
    
    <!-- 2 Column cards in desktop -->
    <rect x="30" y="135" width="200" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="250" y="135" width="200" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="30" y="255" width="420" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Mobile Screen overlapping on the right -->
    <g transform="translate(420, 40)">
      <rect width="200" height="360" rx="22" fill="#090d16" stroke="#475569" stroke-width="2"/>
      <!-- Mobile notch / top bar -->
      <rect x="60" y="10" width="80" height="12" rx="6" fill="#1e293b"/>
      <!-- Mobile screen inner -->
      <rect x="15" y="40" width="170" height="20" rx="4" fill="#38bdf8"/>
      <rect x="15" y="70" width="170" height="8" rx="2" fill="#64748b"/>
      <rect x="15" y="84" width="140" height="8" rx="2" fill="#475569"/>
      <rect x="15" y="106" width="80" height="26" rx="4" fill="#0284c7"/>
      
      <!-- Mobile card stack -->
      <rect x="15" y="150" width="170" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="235" width="170" height="75" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <!-- Home bar -->
      <rect x="70" y="340" width="60" height="4" rx="2" fill="#64748b"/>
    </g>
  </g>
</svg>
